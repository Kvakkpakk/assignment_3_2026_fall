<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Music Collection and playlist</title>
  </head>
  <body>
    <main>
      <h1>Play Music</h1>
      <section class="music-collection-section">
        <h2>Music Collection</h2>
        <search class="music-collection-section__controls">
          <label for="searchInput">Search</label>
          <input type="search" id="searchInput" placeholder="Title or artist" />
          <label for="selectGenre">Genre</label>
          <select id="selectGenre">
            <option value="all">All Genres</option>
          </select>
          <label for="sortingBy">Sort by</label>
          <select id="sortingBy">
            <option value="title">Title</option>
            <option value="artist">Artist</option>
            <option value="duration">Duration</option>
          </select>
          <button type="button" id="sortDirectionButton">Ascending</button>
        </search>
        <ul class="song-list" id="songList"></ul>
      </section>
    </main>
    <script src="./data/songs.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
